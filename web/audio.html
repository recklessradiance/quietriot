<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>quietriot live audio</title>
<style>
  html,body { margin:0; padding:0; background:#0b0e12; color:#d7dde5;
              font-family:-apple-system,'Helvetica Neue',Arial,sans-serif;
              height:100%; }
  .wrap { max-width:420px; margin:0 auto; padding:28px 18px; text-align:center; }
  h1 { font-size:20px; font-weight:600; color:#7fd4a8; margin:0 0 4px; }
  .sub { font-size:12px; color:#69737f; margin-bottom:26px; }
  #st { font-size:15px; margin:18px 0; min-height:20px; }
  #st.err { color:#e08080; }
  #st.live { color:#7fd4a8; }
  #go { display:block; width:100%; padding:16px; font-size:17px; font-weight:600;
        border:0; border-radius:10px; background:#2e7d55; color:#fff; }
  #meter { height:14px; background:#161b22; border-radius:7px; overflow:hidden;
           margin:22px 0 6px; border:1px solid #232a33; }
  #fill { height:100%; width:0%; background:linear-gradient(90deg,#2e7d55,#7fd4a8);
          transition:width 90ms linear; }
  #lat { font-size:11px; color:#69737f; }
  .hint { font-size:11px; color:#69737f; margin-top:26px; line-height:1.5; }
</style>
</head>
<body>
<div class="wrap">
  <h1>quietriot</h1>
  <div class="sub">live mic from the iphone 4s - low latency</div>
  <div id="st">tap enable to connect</div>
  <button id="go">Enable live audio</button>
  <div id="meter"><div id="fill"></div></div>
  <div id="lat"></div>
  <div class="hint">
    Start/stop the daemon from Notification Center (QuietRiot buttons).<br>
    This page reconnects by itself when the daemon comes back.
  </div>
</div>
<script>
(function () {
  var ctx = null, ws = null, nextT = 0, peak = 0, wantConn = false;
  var st = document.getElementById('st');
  var fill = document.getElementById('fill');
  var lat = document.getElementById('lat');
  var btn = document.getElementById('go');

  function setStatus(txt, cls) {
    st.textContent = txt;
    st.className = cls || '';
  }

  function unlock() {
    // iOS Safari only opens the audio pipeline inside a user gesture
    var b = ctx.createBuffer(1, 2205, ctx.sampleRate);
    var d = b.getChannelData(0);
    for (var i = 0; i < d.length; i++) d[i] = 0;
    var s = ctx.createBufferSource();
    s.buffer = b;
    if (s.start) s.start(0); else s.noteOn(0);
  }

  function sched(f32, n, sr) {
    var now = ctx.currentTime;
    if (nextT < now + 0.02) nextT = now + 0.1;   // (re)sync: skip any backlog
    var b = ctx.createBuffer(1, n, sr);
    b.getChannelData(0).set(f32);
    var s = ctx.createBufferSource();
    s.buffer = b;
    s.connect(ctx.destination);
    if (s.start) s.start(nextT); else s.noteOn(nextT);
    nextT += n / sr;
    if (nextT - now > 0.4) nextT = now + 0.4;    // cap jitter buffer
  }

  function connect() {
    if (!wantConn) return;
    setStatus('connecting...');
    try { ws = new WebSocket('ws://' + location.host + '/ws/audio'); }
    catch (e) { setStatus('websocket not supported here', 'err'); return; }
    ws.binaryType = 'arraybuffer';
    ws.onopen = function () { setStatus('connected - waiting for mic...'); };
    ws.onmessage = function (ev) {
      var i16 = new Int16Array(ev.data);
      var n = i16.length;
      var f = new Float32Array(n);
      var p = 0;
      for (var i = 0; i < n; i++) {
        var v = i16[i] / 32768;
        f[i] = v;
        var a = v < 0 ? -v : v;
        if (a > p) p = a;
      }
      peak = p;
      sched(f, n, 44100);
      setStatus('live', 'live');
      lat.textContent = 'jitter buffer ~' + Math.round((nextT - ctx.currentTime) * 1000) + ' ms';
    };
    ws.onclose = function () {
      setStatus('daemon down - start it from Notification Center', 'err');
      if (wantConn) setTimeout(connect, 2000);
    };
  }

  btn.onclick = function () {
    btn.style.display = 'none';
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) { setStatus('web audio not supported here', 'err'); return; }
    ctx = new AC();
    unlock();
    wantConn = true;
    connect();
  };

  setInterval(function () {
    peak *= 0.6;
    fill.style.width = Math.min(100, Math.round(peak * 220)) + '%';
  }, 100);
})();
</script>
</body>
</html>
